name: Keep Backend Alive

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 2 minutes
  workflow_dispatch:      # Allows manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          curl -f ${{ secrets.BACKEND_URL }} || echo "Ping failed"

